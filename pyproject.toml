[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goddard"
version = "0.1.0"
description = "Flight performance model for the Goddard 26-27 hybrid sounding rocket"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
report = ["openpyxl>=3.1", "matplotlib>=3.7"]

[project.scripts]
goddard = "goddard.cli:main"

[tool.setuptools.packages.find]
include = ["goddard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
